<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">How tattoo works</title>
  <desc id="desc">While the context is still whole (decisions, forks, user rules, dead ends, open questions), /tattoo writes a structured snapshot to ~/.local/state/tattoo/&lt;session&gt;.md, for example 36 KB. After /compact, manual or auto, Claude's context is the lossy compaction summary plus the snapshot re-injected verbatim as parts 1/5 to 5/5 by the SessionStart:compact hook: 8 hook copies, at most 10k chars each. Claude Code caps each hook output at 10,000 chars.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .s12 { font-size: 12px; }
    .s13 { font-size: 13px; }
    .s14 { font-size: 14px; }
    .s15 { font-size: 15px; }
    .s18 { font-size: 18px; }
    .b { font-weight: 600; }
    .n { font-weight: 400; }
    .i { font-style: italic; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .acc { fill: #cf222e; }
    .teal { fill: #0f766e; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #cf222e; stroke-width: 1.5; stroke-linejoin: round; }
    .part { fill: #ffffff; stroke: #0f766e; stroke-width: 1.5; }
    .pill { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 3 2.5; }
    .line-acc { fill: none; stroke: #cf222e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .line-teal { fill: none; stroke: #0f766e; stroke-width: 1.5; stroke-linecap: round; }
    .brace { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .rule { fill: none; stroke: #d1d9e0; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="head-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" class="acc"/>
    </marker>
    <marker id="head-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" class="teal"/>
    </marker>
  </defs>

  <!-- Stage 1: context still whole -->
  <rect class="panel" x="4" y="8" width="192" height="304" rx="12"/>
  <text class="sans title" x="20" y="36">context still whole</text>
  <g class="sans s14 ink">
    <rect class="box" x="20" y="56" width="160" height="34" rx="10"/>
    <circle class="acc" cx="36" cy="73" r="3.5"/>
    <text x="48" y="78">decisions</text>
    <rect class="box" x="20" y="103" width="160" height="34" rx="10"/>
    <circle class="acc" cx="36" cy="120" r="3.5"/>
    <text x="48" y="125">forks</text>
    <rect class="box" x="20" y="150" width="160" height="34" rx="10"/>
    <circle class="acc" cx="36" cy="167" r="3.5"/>
    <text x="48" y="172">user rules</text>
    <rect class="box" x="20" y="197" width="160" height="34" rx="10"/>
    <circle class="acc" cx="36" cy="214" r="3.5"/>
    <text x="48" y="219">dead ends</text>
    <rect class="box" x="20" y="244" width="160" height="34" rx="10"/>
    <circle class="acc" cx="36" cy="261" r="3.5"/>
    <text x="48" y="266">open questions</text>
  </g>

  <!-- Stage 3 panel (drawn early so connectors sit on top) -->
  <rect class="panel" x="560" y="8" width="396" height="304" rx="12"/>

  <!-- /tattoo arrow -->
  <circle class="acc" cx="196" cy="190" r="3.5"/>
  <line class="line-acc" x1="196" y1="190" x2="267" y2="190" marker-end="url(#head-acc)"/>
  <text class="mono s14 b acc" x="233" y="180" text-anchor="middle">/tattoo</text>

  <!-- Snapshot file card -->
  <path class="card" d="M282,134 H436 L452,150 V236 A10,10 0 0 1 442,246 H282 A10,10 0 0 1 272,236 V144 A10,10 0 0 1 282,134 Z"/>
  <path class="line-acc" d="M436,134 V146 A4,4 0 0 0 440,150 H452"/>
  <text class="mono s13 ink" x="288" y="164">~/.local/state/</text>
  <text class="mono s13 ink" x="288" y="182">tattoo/&lt;session&gt;.md</text>
  <text class="sans s13 muted" x="288" y="210">structured snapshot,</text>
  <text class="sans s13 muted" x="288" y="228">e.g. 36 KB</text>

  <!-- /compact arrow fanning out into the parts -->
  <line class="line-teal" x1="452" y1="190" x2="560" y2="190"/>
  <text class="mono s14 b teal" x="506" y="180" text-anchor="middle">/compact</text>
  <text class="sans s13 muted" x="506" y="208" text-anchor="middle">manual or auto</text>
  <g class="line-teal">
    <path d="M560,190 C590,190 586,132 616,132" marker-end="url(#head-teal)"/>
    <path d="M560,190 C590,190 586,161 616,161" marker-end="url(#head-teal)"/>
    <path d="M560,190 L616,190" marker-end="url(#head-teal)"/>
    <path d="M560,190 C590,190 586,219 616,219" marker-end="url(#head-teal)"/>
    <path d="M560,190 C590,190 586,248 616,248" marker-end="url(#head-teal)"/>
  </g>
  <circle class="teal" cx="560" cy="190" r="3.5"/>

  <!-- Stage 3: right after compaction -->
  <text class="sans title" x="576" y="36">right after compaction</text>

  <rect class="box" x="620" y="52" width="320" height="38" rx="10"/>
  <text class="sans s14 ink" x="636" y="76">compaction summary</text>
  <rect class="pill" x="872" y="60" width="52" height="22" rx="10"/>
  <text class="sans s12 i muted" x="898" y="75" text-anchor="middle">lossy</text>

  <text class="sans s18 muted" x="590" y="111" text-anchor="middle">+</text>

  <g class="mono s13 ink" text-anchor="middle">
    <rect class="part" x="620" y="120" width="92" height="24" rx="10"/>
    <text x="666" y="136.5">part 1/5</text>
    <rect class="part" x="620" y="149" width="92" height="24" rx="10"/>
    <text x="666" y="165.5">part 2/5</text>
    <rect class="part" x="620" y="178" width="92" height="24" rx="10"/>
    <text x="666" y="194.5">part 3/5</text>
    <rect class="part" x="620" y="207" width="92" height="24" rx="10"/>
    <text x="666" y="223.5">part 4/5</text>
    <rect class="part" x="620" y="236" width="92" height="24" rx="10"/>
    <text x="666" y="252.5">part 5/5</text>
  </g>

  <path class="brace" d="M722,120 Q728,120 728,126 V184 Q728,190 734,190 Q728,190 728,196 V254 Q728,260 722,260"/>
  <text class="mono s13 teal" x="746" y="164">SessionStart:compact</text>
  <text class="sans s13 muted" x="746" y="184">8 hook copies</text>
  <text class="sans s13 muted" x="746" y="204">≤ 10k chars each</text>
  <text class="sans s13 b ink" x="746" y="224">verbatim</text>

  <line class="rule" x1="620" y1="274" x2="940" y2="274"/>
  <text class="sans s18 muted" x="590" y="297" text-anchor="middle">=</text>
  <text class="sans s15 b ink" x="620" y="296">Claude's context<tspan class="s13 n muted" dx="8">— what Claude sees</tspan></text>

  <!-- Footnote -->
  <text class="sans s12 muted" x="956" y="334" text-anchor="end">Claude Code caps each hook output at 10,000 chars</text>
</svg>
